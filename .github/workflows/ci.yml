name: CI

on:
  push:
    branches: [main, hml]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatação
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Testes com cobertura
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: '**/coverage/'
          if-no-files-found: ignore
          retention-days: 7

  seguranca:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --prod --audit-level high

  docker:
    name: Imagem Docker (${{ matrix.app }})
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: convergia-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
