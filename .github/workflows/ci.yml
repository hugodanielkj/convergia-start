name: CI

on:
  push:
    branches: [main, hml]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: convergia
          POSTGRES_PASSWORD: convergia
          POSTGRES_DB: convergia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U convergia"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://convergia:convergia@localhost:5432/convergia
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrações do banco
        run: pnpm --filter @convergia/api db:deploy
      - name: Migrações batem com o schema
        working-directory: apps/api
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
      - name: Formatação
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Testes unitários e de integração, com cobertura
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: '**/coverage/'
          if-no-files-found: ignore
          retention-days: 7

  celular:
    # Decisão mobile-first (2026-11-14-a-mobile-first): telas a 360, 375 e 768px.
    name: Telas no celular (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: convergia
          POSTGRES_PASSWORD: convergia
          POSTGRES_DB: convergia
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U convergia"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://convergia:convergia@localhost:5432/convergia
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrações do banco
        run: pnpm --filter @convergia/api db:deploy
      - name: Navegador do Playwright
        run: pnpm --filter @convergia/web exec playwright install --with-deps chromium-headless-shell
      - name: Build da web
        run: pnpm --filter @convergia/web... build
        env:
          API_URL: http://localhost:3334
      - name: Testes de celular
        run: pnpm --filter @convergia/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: relatorio-celular
          path: apps/web/playwright-report/
          retention-days: 7

  seguranca:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --prod --audit-level high

  docker:
    name: Imagem Docker (${{ matrix.app }})
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: convergia-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
