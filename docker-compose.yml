# Infra local: `pnpm infra:up`. Aplicações em container: `docker compose --profile app up --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: convergia
      POSTGRES_PASSWORD: convergia
      POSTGRES_DB: convergia
    # Porta 55432 no host para não colidir com outros Postgres da máquina.
    ports: ['55432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convergia']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DATABASE_URL: postgresql://convergia:convergia@postgres:5432/convergia
      REDIS_URL: redis://redis:6379
    ports: ['3333:3333']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  postgres-data:
